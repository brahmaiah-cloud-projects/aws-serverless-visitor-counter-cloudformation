AWSTemplateFormatVersion: 2010-09-09

Description: Creating A DynamoDB for Visitors

Resources:

  VisitorsTable:

    Type: AWS::DynamoDB::Table
    Properties:

      TableName: VisitorCounter
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S

      KeySchema:
        - AttributeName: id
          KeyType: HASH


Outputs: 

  TableName: 

    Value: !Ref VisitorsTable

  TableArn:

    Value: !GetAtt VisitorsTable.Arn


